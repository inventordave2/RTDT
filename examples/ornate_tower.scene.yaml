# Ornate Tower - Advanced Scene
# 
# This scene demonstrates:
#   - Complex nested transformations
#   - Scaling with expressions
#   - Multiple nested repeat loops
#   - Advanced reflectivity patterns

metadata:
  name: "Ornate Tower"
  author: "RTDT User"
  description: "A tapered tower with ornamental spheres around each level"
  version: 1.0

materials:
  stone:
    color: [0.6, 0.6, 0.6]
    ambient: 0.15
    diffuse: 0.7
    specular: 0.3
    shininess: 50
    reflective: 0.1
    
  gold:
    color: [1, 0.84, 0]
    ambient: 0.2
    diffuse: 0.8
    specular: 0.9
    shininess: 200
    reflective: 0.6
    
  sapphire:
    color: [0.05, 0.16, 0.76]
    ambient: 0.15
    diffuse: 0.8
    specular: 0.8
    shininess: 150
    reflective: 0.4
    transparency: 0.2
    refractive_index: 1.77
    casts_shadow: true

cameras:
  - position: [0, 8, 20]
    target: [0, 5, 0]
    up: [0, 1, 0]
    fov: 40

lights:
  - position: [-20, 15, 15]
    intensity: [1, 1, 1]
  - position: [20, 10, 10]
    intensity: [0.6, 0.6, 0.6]

objects:
  # Ground plane
  - type: plane
    position: [0, 0, 0]
    material: stone

  # Base pedestal
  - type: cube
    scaling: [3, 0.5, 3]
    position: [0, 0.5, 0]
    material: stone

  # Tower shaft (stacked segments)
  - type: group
    name: tower_shaft
    repeat:
      count: 5
    children:
      # Main segment cube
      - type: cube
        scaling: ["2 - i*0.3, 1, 2 - i*0.3"]
        position: "[0, i*2 + 2, 0]"
        material: stone

      # Ornamental spheres around each level
      - type: group
        name: level_ornaments
        repeat:
          count: 8
        children:
          - type: sphere
            radius: 0.25
            position: "[(2-i*0.3) * cos(j*2*pi/8), i*2 + 2.5, (2-i*0.3) * sin(j*2*pi/8)]"
            material: gold
            reflective: "0.5 + i*0.05"

  # Top spire
  - type: sphere
    radius: 0.8
    position: [0, 12, 0]
    material: sapphire
    reflective: 0.5
